<!-- Creating a separate web page for the sign in -->
<!-- allows space for input and redirecting to home page or sign in -->
<!-- contributors: Fatema Y. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sign-in Page </title>
    <!-- adding a font style from google fonts, we chose roboto condensed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- linking the html to the same style.css as home page-->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="page">
        <!-- formatting the header -->
        <header> 
            <nav class="narbar"> 
                <!-- redirecting to main page! -->
                <a class="brand" href="./">Whole Eats Shopping</a>

                <!-- adding the create account bottun -->
                <button id="create-account" class="account-button primary" type="button"
                  onclick="window.location.href = 'createAccount.html'">
                    Create Account
                </button>
            </nav>
        </header>
        <!-- creating the space for username and password input -->
        <main >
            <div class="account-body">
                <h1 class="special-h1"> 
                    Sign into Existing Account  
                </h1>
                <div class="input-container">
                    <input type="text" placeholder="username..." id="username" >
                    <input type="text" placeholder="password..." id="password" >
                </div>
                <!-- submission button -->
                    <button id="submit" class="account-button primary" type="button"
                     onclick="showLoading()">
                        Log In
                    </button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
